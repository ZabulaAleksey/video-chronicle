[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-chronicle"
version = "0.2.0"
description = "Local desktop tool for chronologically joining photos and videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
video-chronicle = "video_chronicle.cli:main"

[project.gui-scripts]
video-chronicle-gui = "video_chronicle.gui:main"

[tool.setuptools]
packages = ["video_chronicle"]
py-modules = ["join_media", "gui_contract", "video_chronicle_gui"]

[tool.setuptools.package-dir]
video_chronicle = "src/video_chronicle"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
