    { name = "pytest" },
]
otio = [
    { name = "opentimelineio" },
]

[package.metadata]
requires-dist = [
    { name = "opentimelineio", marker = "extra == 'otio'", specifier = "==0.18.1" },
    { name = "pyside6", specifier = ">=6.8,<7" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=8,<10" },
]
provides-extras = ["dev", "otio"]
